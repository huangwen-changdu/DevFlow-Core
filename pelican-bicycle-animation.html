<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#bfe8ef" />
  <title>骑自行车的鹈鹕 · SVG 动画</title>
  <style>
    :root {
      --ink: #213a3e;
      --cream: #f8f0df;
      --coral: #e86452;
      --gold: #f4bd4f;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100svh;
      padding: clamp(10px, 2.5vw, 34px);
      overflow-x: hidden;
      background:
        radial-gradient(circle at 16% 10%, rgba(255, 255, 255, 0.92), transparent 34%),
        radial-gradient(circle at 86% 92%, rgba(235, 168, 102, 0.2), transparent 36%),
        linear-gradient(135deg, #f7f2e7 0%, #e8eee3 48%, #d9e8df 100%);
      font-family: ui-rounded, "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .stage {
      width: min(1200px, 100%, calc((100svh - 42px) * 1.5));
      border-radius: clamp(18px, 3vw, 34px);
      overflow: hidden;
      background: #bfe8ef;
      box-shadow:
        0 28px 70px -24px rgba(24, 56, 58, 0.52),
        0 2px 0 rgba(255, 255, 255, 0.65) inset;
      isolation: isolate;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ---------- scene motion ---------- */

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes sun-turn {
      to { transform: rotate(360deg); }
    }

    @keyframes cloud-drift {
      from { transform: translateX(-14px); }
      to   { transform: translateX(22px); }
    }

    @keyframes road-move {
      to { stroke-dashoffset: -100; }
    }

    @keyframes streak {
      to { stroke-dashoffset: -190; }
    }

    @keyframes ride-bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(2.6px); }
    }

    @keyframes shadow-breathe {
      0%, 100% { transform: scaleX(1); opacity: 0.18; }
      50%      { transform: scaleX(0.965); opacity: 0.13; }
    }

    @keyframes blink {
      0%, 88%, 92%, 100% { transform: scaleY(1); }
      89.5%, 90.5%       { transform: scaleY(0.08); }
    }

    @keyframes crest-ruffle {
      from { transform: rotate(-3deg); }
      to   { transform: rotate(4deg); }
    }

    @keyframes scarf-wave {
      from { transform: rotate(-2.5deg); }
      to   { transform: rotate(4.5deg); }
    }

    @keyframes grass-sway {
      from { transform: rotate(-2.5deg); }
      to   { transform: rotate(3.5deg); }
    }

    @keyframes dust-puff {
      0%   { transform: translate(0, 0) scale(0.35); opacity: 0.45; }
      70%  { opacity: 0.12; }
      100% { transform: translate(-56px, -20px) scale(1.35); opacity: 0; }
    }

    @keyframes bell-ring {
      0%, 16%   { opacity: 0; transform: scale(0.65); }
      22%       { opacity: 0.65; }
      52%, 100% { opacity: 0; transform: scale(1.7); }
    }

    @keyframes flock-drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(-9px, 5px); }
    }

    .wheel {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1.08s linear infinite;
    }

    .sun-rays {
      transform-box: fill-box;
      transform-origin: center;
      animation: sun-turn 52s linear infinite;
    }

    .cloud {
      animation: cloud-drift 10s ease-in-out infinite alternate;
    }
    .cloud-b { animation-duration: 13s; animation-delay: -4s; }
    .cloud-c { animation-duration: 16s; animation-delay: -8s; }

    .road-dashes {
      animation: road-move 1.05s linear infinite;
    }

    .speed-line {
      stroke-dasharray: 48 142;
      animation: streak 1.25s linear infinite;
    }
    .speed-line:nth-child(2) { animation-delay: -0.42s; }
    .speed-line:nth-child(3) { animation-delay: -0.84s; }

    .bike-rider {
      transform-box: fill-box;
      transform-origin: 55% 74%;
      animation: ride-bob 1.16s ease-in-out infinite;
    }

    .bike-shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: shadow-breathe 1.16s ease-in-out infinite;
    }

    .eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 5.4s ease-in-out infinite;
    }

    .crest {
      transform-box: fill-box;
      transform-origin: 100% 100%;
      animation: crest-ruffle 1.35s ease-in-out infinite alternate;
    }

    .scarf-tails {
      transform-box: fill-box;
      transform-origin: 100% 45%;
      animation: scarf-wave 1.5s ease-in-out infinite alternate;
    }

    .bell-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: bell-ring 3s ease-out infinite;
    }

    .grass {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: grass-sway 2.7s ease-in-out infinite alternate;
    }
    .grass-b { animation-delay: -1.3s; animation-duration: 3.2s; }

    .dust circle {
      transform-box: fill-box;
      transform-origin: center;
      animation: dust-puff 1.6s ease-out infinite;
    }
    .dust circle:nth-child(2) { animation-delay: 0.3s; }
    .dust circle:nth-child(3) { animation-delay: 0.6s; }
    .dust circle:nth-child(4) { animation-delay: 0.9s; }

    .flock {
      animation: flock-drift 4.5s ease-in-out infinite alternate;
    }

    @media (max-width: 640px) {
      body { padding: 8px; }
      .stage { border-radius: 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wheel,
      .sun-rays,
      .cloud,
      .road-dashes,
      .speed-line,
      .bike-rider,
      .bike-shadow,
      .eye,
      .crest,
      .scarf-tails,
      .bell-ring,
      .grass,
      .dust circle,
      .flock {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg id="scene" viewBox="0 0 1200 800" role="img" aria-labelledby="sceneTitle sceneDesc" shape-rendering="geometricPrecision">

  <script>
    (() => {
      const crank = document.getElementById('crank');
      const footNear = document.getElementById('footNear');
      const footFar = document.getElementById('footFar');
      const pedalNear = document.getElementById('pedalNear');
      const pedalFar = document.getElementById('pedalFar');

      const legs = [
        {
          hip: { x: 592, y: 397 },
          offset: 0,
          upper: [document.getElementById('nearUpperOutline'), document.getElementById('nearUpper')],
          lower: [document.getElementById('nearLowerOutline'), document.getElementById('nearLower')],
          foot: footNear,
          pedal: pedalNear
        },
        {
          hip: { x: 566, y: 396 },
          offset: Math.PI,
          upper: [document.getElementById('farUpperOutline'), document.getElementById('farUpper')],
          lower: [document.getElementById('farLowerOutline'), document.getElementById('farLower')],
          foot: footFar,
          pedal: pedalFar
        }
      ];

      const CX = 610;
      const CY = 585;
      const R = 40;
      const THIGH = 120;
      const SHIN = 115;
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      let angle = 0.55;
      let running = false;
      let rafId = 0;
      let lastTime = 0;

      const f = (n) => Number(n.toFixed(1));
      const dLine = (a, b) => 'M' + f(a.x) + ' ' + f(a.y) + 'L' + f(b.x) + ' ' + f(b.y);

      function kneePoint(hip, ankle) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const rawDist = Math.hypot(dx, dy) || 1;
        const reach = THIGH + SHIN - 0.5;
        const dist = Math.min(rawDist, reach);
        const along = (THIGH * THIGH - SHIN * SHIN + dist * dist) / (2 * dist);
        const lift = Math.sqrt(Math.max(0, THIGH * THIGH - along * along));
        const ux = dx / rawDist;
        const uy = dy / rawDist;
        return {
          x: hip.x + ux * along + uy * lift,
          y: hip.y + uy * along - ux * lift
        };
      }

      function drawLeg(leg, phase) {
        const px = CX + R * Math.cos(phase);
        const py = CY + R * Math.sin(phase);
        const ankle = { x: px - 1, y: py - 6 };
        const knee = kneePoint(leg.hip, ankle);
        const upperPath = dLine(leg.hip, knee);
        const lowerPath = dLine(knee, ankle);

        leg.upper.forEach((path) => path.setAttribute('d', upperPath));
        leg.lower.forEach((path) => path.setAttribute('d', lowerPath));

        leg.foot.setAttribute(
          'transform',
          'translate(' + f(px - 4) + ' ' + f(py - 2) + ') rotate(' + f(Math.sin(phase) * 3.2) + ')'
        );
        leg.pedal.setAttribute('transform', 'translate(' + f(px) + ' ' + f(py) + ')');
      }

      function render(theta) {
        const degrees = (theta * 180) / Math.PI;
        crank.setAttribute('transform', 'rotate(' + f(degrees) + ' ' + CX + ' ' + CY + ')');
        legs.forEach((leg) => drawLeg(leg, theta + leg.offset));
      }

      function tick(now) {
        if (!running) return;
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        angle += dt * 2.55;
        render(angle);
        rafId = requestAnimationFrame(tick);
      }

      function start() {
        if (running) return;
        running = true;
        lastTime = performance.now();
        rafId = requestAnimationFrame(tick);
      }

      function stop() {
        running = false;
        cancelAnimationFrame(rafId);
      }

      render(angle);

      if (!reduceMotion.matches) {
        start();
      }

      if (typeof reduceMotion.addEventListener === 'function') {
        reduceMotion.addEventListener('change', (event) => {
          if (event.matches) {
            stop();
          } else {
            start();
          }
        });
      }
    })();
  </script>
