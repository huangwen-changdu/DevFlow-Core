description = "Create a reviewed, executable implementation plan from an approved DevFlow spec or design."
prompt = '''
Load `skills/devflow-plan/SKILL.md` and create the single DevFlow Plan Pack from `CUT_PASS` plus its approved design or saved spec.

`CUT_PASS` must state the allowed scope, reuse conclusion, exclusions, and verification constraints. Do not create a construction plan before Cut returns `CUT_PASS`.

Save plans by default at:

```text
docs/plans/YYYY-MM-DD-<short-kebab-name>.md
```

Keep the plan header in English:

```text
Goal: <outcome>
Architecture: <smallest design and boundaries>
Tech Stack: <relevant existing stack>
Source: <docs/specs/YYYY-MM-DD-<short-kebab-name>.md or approved design>
Spec coverage: <requirements mapped to tasks, or design-only>
Cut Decision: <CUT_PASS allowed scope, reuse conclusion, exclusions, verification constraints>
```

Each independently understandable task must contain:

```text
Task: <short title>
Files:
- Create: <path> | <responsibility>
- Modify: <path> | <responsibility>
- Test: <path> | <behavior proved>  # only when applicable
Interfaces:
- Consumes: <input or documentation-only exception>
- Produces: <output or documentation-only exception>
Steps:
- [ ] <concrete file + symbol/behavior/command + expected result>
- [ ] <concrete file + symbol/behavior/command + expected result>
Acceptance: <specific condition>
Verify: <exact command or manual scenario>
Comments: <required code comments or "none — trivial change">
Not doing: <scope removed>
```

Run `node scripts/devflow-plan.js <plan-file>` when it exists; otherwise use the user-level fallback specified in `core-methods.md`. Self-review source coverage, interfaces, concrete steps, placeholders, and file-operation labels before presenting the plan.

STOP after writing and validating the plan: request user review. After approval, perform a lightweight Cut-consistency review and hand off to `devflow-build` when the plan remains within `CUT_PASS`. Return to `devflow-cut` only to re-run affected gates when the plan adds scope, dependencies, abstractions, or file responsibilities. Do not perform Cut, Build, Prove, test-first workflow, version-control task steps, independent review, or automatic execution here.
'''
