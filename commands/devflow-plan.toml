description = "Create a reviewed, executable implementation plan from an approved DevFlow spec or design."
prompt = '''
Load `skills/devflow-plan/SKILL.md` after an A/B direct `CUT_PASS`, or when `devflow-core` selects planning for a non-unique artifact. Create the single DevFlow Plan Pack from A/B `CUT_PASS` plus its approved design or confirmed spec.

`CUT_PASS` must state the allowed scope, reuse conclusion, exclusions, and verification constraints. Do not create a construction plan before Cut returns `CUT_PASS`.

Save plans by default at:

```text
docs/plans/YYYY-MM-DD-<short-kebab-name>.md
```

Keep the plan header in English:

```text
Status: draft | approved | in-progress | done | abandoned
Goal: <outcome>
Not doing: <per-plan exclusions and project-level invariants, each traceable to Source or Cut>
Cut: 做 <included> | 不做 <excluded> | 复用 <reused capability> | 验证 <verification> | Rejected: <at least one cut candidate, or none plus evidence why nothing could be cut>
Source: <docs/specs/YYYY-MM-DD-<short-kebab-name>.md or approved design>
Execution mode: sequential | single-subagent | fan-out (optional; ask and record at approval)
Landed: <date and fresh evidence> (completion only)
```

Record the bounded read under `## Recon`: one line per finding, each pairing a backticked command with the output it produced, or `none` with a reason. Every evidence item the plan asks for is either a re-runnable command with its output or a mechanical copy from an existing artifact; a pointer to an existing path or symbol is not enough on its own.

Each independently understandable task must contain:

```text
Task: <short title>
Files:
- Create: <path> | new file | <responsibility>
- Modify: <path> | symbol: <symbol or stable anchor> | <responsibility>
- Test: <path> | symbol: <symbol or stable anchor> | <behavior proved>  # only when applicable
Interfaces:  # only when Execution mode is single-subagent or fan-out
- Consumes: <names and types this task uses from another task>
- Produces: <names and types another task relies on>
Change: <what changes and its boundary; add the smallest runnable mechanics only when the change crosses a module contract, is irreversible, touches security or data boundaries, or the mechanism cannot be inferred from the task's named anchors by a different session or model>
Acceptance: <one specific observable condition>
Verify: <exact command or manual scenario, trigger/input, and expected result>
Not doing: <scope excluded by this task>
```

Every existing-file row names a symbol or stable anchor; every `Create` row uses `new file`. `Acceptance` states exactly one observable result. Close the plan with one `## Progress` row per task carrying `todo`, `doing`, or `done` plus evidence; Build flips the row it works on and Prove writes `Status: done` and `Landed:` on `PASS`.

Run `node scripts/devflow-plan.js <plan-file>` when it exists; otherwise use the user-level fallback specified in `core-methods.md`. Self-review Cut fidelity, touch-set coverage, acceptance proof, scope exclusions, and Progress row count before presenting the plan.

STOP after writing and validating the plan: request user review. On approval, ask execution mode (`sequential` — the Build agent runs tasks in dependency order / `single-subagent` — the main agent only schedules while one subagent runs tasks one per round / `fan-out` — independent tasks run as parallel subagents) and record it as the plan's optional `Execution mode` header, then perform a lightweight Cut-consistency review. An approved A/B Plan directly starts `devflow-build`; any scope-drift or non-success facts return to `devflow-core`. Do not perform Cut, Build, Prove, test-first workflow, version-control task steps, independent review, or automatic execution here.
'''
