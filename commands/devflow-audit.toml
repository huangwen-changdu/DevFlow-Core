description = "Audit a repository or named scope for bugs, risk, load failures, missing tests, slowness, and code that can be deleted."
prompt = '''
Audit the repository or named scope like the senior developer who will be paged when it breaks.
Load `skills/devflow-audit/SKILL.md`, then `skills/devflow-audit/references/full-quality-audit.md`.

Order of importance: correct, safe, holds under load, tested, fast, lean. State the assumed load.

When `scripts/devflow-audit.js` exists, run:

```bash
node scripts/devflow-audit.js <target-directory>
```

If only user-level DevFlow is installed, run the user script instead:

```bash
node ~/.codex/scripts/devflow-audit.js <target-directory>
# or, for Claude Code user-level install:
node ~/.claude/scripts/devflow-audit.js <target-directory>
```

The script is a first-pass scan for lean candidates only. Read referenced code before reporting any finding.

Report numbered findings in Must fix / Should fix / Nice to have, each with What this is, Problem, Fix, and If we skip it. End with:

Verdict: ...
net: -<N> lines, -<M> deps possible.
Not checked: ...

When the user asks only what can be cut, report the lean dimension alone, one line per finding:
<file>:L<line>: <delete|reuse|stdlib|native|yagni|shrink|merge|split>: <what to cut>. <replacement>.

Change no files.
'''
