description = "Route a task through DevFlow Core."

prompt = '''
Use DevFlow Core for this request.

Read `AGENTS.md` and follow its seven-stage process: Sense -> Route -> Gate -> Contract -> Change -> Prove -> Record. Load the `devflow-core` skill from the skill root it names next. If neither the project file nor the skill resolves, run those stages yourself: sense the narrow facts; apply route precedence (explicit independent review -> investigation-only problem report or pure inquiry -> approved scope -> risk gate); require Brainstorm unless all seven low-risk conditions hold; write the smallest contract before changing anything; make the smallest diff; prove with fresh evidence; record. Keywords alone never choose a route. Unapproved edits are not Fast except through the Small-fix gate. An unapproved problem-directed change outside that gate is creative work. A Fast Small-fix (explicit request, a post-diagnosis declared budget, reversible, local, no protected surface, no new structure, one-command proof) skips Brainstorm, Cut, and Plan and proves at `narrow` only with `devflow-smallfix.js` `NARROW_OK`; otherwise it uses `standard` and promotes to Design-lite or Build on any miss. A clear existing-feature change may go directly to Cut only when all seven low-risk conditions hold. An investigation-only problem report proves facts first. An already approved scope continues through Cut, Build, and Prove.

Skill-root paths resolve under the skill root named in `AGENTS.md` (`.agents/skills/` in an installed project, `skills/` in this source repo).

Direct entries:
- 拷问我, 压力测试, grill, or stress-test: load `devflow-brainstorm/SKILL.md` and start clarification.
- 对抗审查, 升级版对抗审查, red-team, or deep adversarial review: load `devflow-adversarial/SKILL.md` and run it in this session, round by round.
- 找茬, 最大遗漏, 没有意识到什么, or 最没有把握: load `devflow-find-fault/SKILL.md`.
- 有问题, 不对, 写错了, 少了, 缺漏, 遗漏, or a repeated same-target miss: use Recovery through `devflow-pua`; an ordinary single correction takes normal repair routing through Core instead.

When Brainstorm is selected, keep the Semantic Echo-Back, the fixed Confirmed request, and the user's A/B/C choice. A real adversarial gap, a failed proof, and a blocked build are FAIL facts, not completion. Report the Completion block: Command / Result / Proof tier / Adversarial review / Judgment.
'''
