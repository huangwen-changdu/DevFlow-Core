description = "Route a task through DevFlow Core."
prompt = '''
Use DevFlow Core for this request.

Route the work as Fast, Design-lite, Design, Build, or Recovery.
If the user reports a problem without explicitly asking for a fix, use Problem: Sense -> Prove facts, then re-route only if a change is needed.
If the user explicitly asks for upgraded adversarial review, deep adversarial review, red-team review, 对抗审查, or 升级版对抗审查, load `skills/devflow-adversarial/SKILL.md` directly. If the user explicitly asks to find faults, identify the biggest omission, surface a blind spot, name the least certain point, 找茬, 最大遗漏, 没有意识到什么, or 最没有把握, load `skills/devflow-find-fault/SKILL.md` directly. These are independent manual reviews: they may run at any stage and must not read, require, modify, or hand off to devflow-prove, PUA, Build, Learn, or any completion state.
If the user challenges the result, says changed wrong, says your code is wrong/you wrote it wrong/has a problem/not right/missing/incomplete/still missing/有问题/不对/写错了/少了/少个/缺少/缺漏/遗漏/漏了, reports a quality complaint, or repeated edits miss, use Recovery through devflow-pua before more edits. For repeated challenge, explicit wrong-code signals, or repeated missing-piece complaints, restart devflow-brainstorm, quarantine the old wrong context, diagnose the user-view miss, ask what is wrong and what result is wanted, then switch to a different/opposite method when the prior method failed.
Use Fast for pure Q&A, fact lookup, verification, or trivial code change (one line, no logic change, no risk).
Use Design-lite for a small change to an existing feature with clear behavior, one plausible path, low risk, local impact, and quick proof. Not for new requirements.
If the boundary is unclear, ask the user to choose Fast, Design-lite, or full Design instead of guessing.
Run Sense first by reading or citing relevant project facts.
At Sense, probe `.copilot/LEARNING_INDEX.md` and `docs/project-knowledge/` when present. Read only matched learning cards or navigation-selected knowledge documents; missing locations are non-blocking and do not create storage.
For requirements or ambiguity, run Brainstorm with 2-3 approaches. The brainstorming skill enforces its own HARD-GATE — Design-lite does not bypass it for new features.
For non-trivial Brainstorm, read skills/devflow-brainstorm/references/interview-discipline.md, ask one question at a time with a recommended answer.
Brainstorm ends at the Depth Selection Gate (STOP): the user picks A/B/C (option semantics live in skills/devflow-brainstorm/SKILL.md). Do not proceed past brainstorm until the user picks a depth.
Before implementation, run Cut with Reuse, Native, Overbuild, Diff, and Scope checks.
For bug fixes, include Root-Cause Check: searched callers/references; shared vs narrow fix; reason.
For deliberate simplifications, add or report `devflow: <ceiling>, revisit when <trigger>`.
If implementation is requested, continue through Build and Prove.
For problem solving, bug fixing, and architecture design, use First Principles Cut when the cause, constraint, invariant, abstraction, or smallest correct mechanism is unclear; reduce to facts, constraints, and invariants before selecting a solution.
Before completion of development work, run adversarial review against acceptance criteria, touched files, likely regressions, activation paths, and proof coverage. A real gap means FAIL or continued work before completion.

Design output:
Goal:
Smallest useful plan:
Not doing:
Impact:
Verification:

Completion proof:
Command:
Result:
Adversarial review:
Judgment: PASS / FAIL / BLOCKED
'''
