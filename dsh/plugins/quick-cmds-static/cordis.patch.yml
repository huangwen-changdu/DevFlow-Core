# @devflow-core/dsh-client-quick-cmds bundle patch: inserts the client-plugin
# row into the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) over dsh-base; activate with
# `dsh plugin --profile web add @devflow-core/dsh-client-quick-cmds`.
#
# The row is a bare plugin by package name: the node half (exports ".") is a
# minimal loader stub, and the browser half (exports "./client", declared via
# package.json `dsh.client.platform`) renders the quick-command buttons above
# the composer and the 设置 → 快捷命令 config page.
- insert:
    - id: ui-quick-cmds
      name: '@devflow-core/dsh-client-quick-cmds'
