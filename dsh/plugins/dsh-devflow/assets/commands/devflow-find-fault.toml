description = "Find missing, unconfirmed, or least-certain parts of current work with an independent manual review."
prompt = '''
Run DevFlow Find Fault.

Load `skills/devflow-find-fault/SKILL.md` and review the user-specified current task materials.
This command is manual and independent: it does not require, read, modify, or hand off to devflow-prove, PUA, Build, Learn, or any completion state.
If the request is a bare review, ask one selector question first: what is missing or unconfirmed (this review), does the result hold (`/devflow-adversarial`), whole-repo quality (`/devflow-audit`), or overengineering in a diff/plan (`/devflow-review`). Do not run two review owners by default.
Answer the biggest omission, unrecognized blind spot, and least certain point, plus every explicit user question.
When reviewing implemented work, also run a post-implementation unease check: find business decisions encoded by the implementation but not explicitly confirmed, classify their risk, and state the confirmation needed.
Separate facts, inference, and unknowns; give every answer confidence and a next step, then report finding levels, unease decisions, limitations, and suggested manual action.
Close with a necessary adjustments and fixes list: one item per required change, giving its severity, the finding or unease decision it traces to, why the change is necessary, the smallest suggested fix, and the verification that proves it is done; write `none` when nothing requires adjustment, and add no fault that the findings do not already report.
Run the review in bounded rounds, one round per question and one round for the post-implementation unease check; report each round's findings plus the proposed minimal fix for each, and assemble the final report after the last round.
Do not edit files, invoke another skill, create a task, or declare global task status.
'''
